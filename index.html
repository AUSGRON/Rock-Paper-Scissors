```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RPS — Arena</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>

    <main class="app">

        <!-- HEADER -->
        <header class="hero">

            <div class="eyebrow">
                <span class="status-dot"></span>
                ONLINE ARENA
            </div>

            <h1>
                ROCK
                <span>PAPER</span>
                SCISSORS
            </h1>

            <p>
                Choose your weapon. Outsmart the machine.
            </p>

        </header>


        <!-- GAME -->
        <section class="game-panel">

            <div class="panel-top">
                <span>PLAYER VS AI</span>
                <span class="round">ROUND <b id="round">1</b></span>
            </div>


            <!-- CHOICES -->
            <div class="choices">

                <button class="choice" id="rock" aria-label="Rock">

                    <div class="icon-wrap rock-icon">
                        <div class="rock-shape">✊</div>
                    </div>

                    <div class="choice-name">ROCK</div>
                    <div class="choice-hint">POWER</div>

                </button>


                <button class="choice" id="paper" aria-label="Paper">

                    <div class="icon-wrap paper-icon">
                        <div class="paper-shape">📄</div>
                    </div>

                    <div class="choice-name">PAPER</div>
                    <div class="choice-hint">TACTIC</div>

                </button>


                <button class="choice" id="scissors" aria-label="Scissors">

                    <div class="icon-wrap scissors-icon">
                        <div class="scissors-shape">✂</div>
                    </div>

                    <div class="choice-name">SCISSORS</div>
                    <div class="choice-hint">PRECISION</div>

                </button>

            </div>


            <!-- SCORE -->
            <div class="score-area">

                <div class="score-card">

                    <span class="score-title">YOU</span>

                    <strong id="user-score">0</strong>

                    <span class="score-subtitle">
                        PLAYER
                    </span>

                </div>


                <div class="versus">
                    <div>VS</div>
                </div>


                <div class="score-card">

                    <span class="score-title">COMPUTER</span>

                    <strong id="comp-score">0</strong>

                    <span class="score-subtitle">
                        AI OPPONENT
                    </span>

                </div>

            </div>


            <!-- RESULT -->
            <div class="result-box">

                <div class="result-icon" id="result-icon">
                    ⚡
                </div>

                <div>
                    <span class="result-label">BATTLE STATUS</span>

                    <p id="msg">
                        Make your move
                    </p>
                </div>

            </div>

        </section>


        <!-- FOOTER -->
        <footer>
            <span>RPS ARENA</span>
            <span>•</span>
            <span>FIRST TO INFINITY</span>
        </footer>

    </main>


    <script src="app.js"></script>

</body>
</html>
```
